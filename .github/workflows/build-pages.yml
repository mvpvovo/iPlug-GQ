# Rebuilds event pages, area pages, this-weekend.html, sitemap.xml and the gig social pack
# whenever events.csv changes, plus every day at 06:00 SAST so "this weekend" stays current.
# Also builds the New Music Friday social pack (carousel images + captions) whenever
# music-releases.json changes, and every Friday morning (for scheduled releases).
name: Build SEO pages
on:
  push:
    paths: ["events.csv", "build_pages.py", "music-releases.json", "tools/**"]
  schedule:
    - cron: "0 4 * * *"      # 04:00 UTC = 06:00 SAST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generate gig pages
        run: TZ=Africa/Johannesburg python3 build_pages.py
      - name: Generate New Music Friday social pack
        run: |
          # On the daily schedule, only rebuild on Fridays (keeps the repo history tidy)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(TZ=Africa/Johannesburg date +%u)" = "5" ]; then
            pip install --quiet pillow
            python3 tools/nmf_social.py
          else
            echo "Not Friday: skipping music pack"
          fi
      - name: Commit changes
        run: |
          git config user.name "iplug-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events areas this-weekend.html sitemap.xml robots.txt social
          git diff --cached --quiet || git commit -m "Auto-build pages & social packs $(date +%F)"
          git pull --rebase --quiet origin main || true
          git push
