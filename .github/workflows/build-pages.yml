# Rebuilds event pages, area pages, this-weekend.html, sitemap.xml and the social pack
# whenever events.csv changes, plus every day at 06:00 SAST so "this weekend" stays current.
name: Build SEO pages
on:
  push:
    paths: ["events.csv", "build_pages.py"]
  schedule:
    - cron: "0 4 * * *"      # 04:00 UTC = 06:00 SAST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generate pages
        run: TZ=Africa/Johannesburg python3 build_pages.py
      - name: Commit changes
        run: |
          git config user.name "iplug-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events areas this-weekend.html sitemap.xml robots.txt social
          git diff --cached --quiet || git commit -m "Auto-build event pages $(date +%F)"
          git push
